# Same stack, built from this repository (Portainer "Repository" stack or `docker compose -f docker-compose.build.yml up -d --build`).
services:
  tbot-ultra:
    build: .
    image: tbot-ultra:local
    container_name: tbot-ultra
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6080:6080"
    environment:
      TBOT_WEB_PASSWORD: "change-me"
      VNC_PASSWORD: "change-me"
      TZ: "Europe/Berlin"
    volumes:
      - tbot-data:/data
    shm_size: "1gb"

volumes:
  tbot-data:
