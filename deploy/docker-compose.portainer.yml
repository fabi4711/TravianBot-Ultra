# Stack deployed by scripts/deploy.sh; Portainer fills ${…} from the stack environment.
services:
  tbot-ultra:
    image: ${REGISTRY:?set REGISTRY}/tbot-ultra:${VERSION:-latest}
    container_name: tbot-ultra
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "${HOST_PORT:-8090}:8080"
      - "${VNC_PORT:-6080}:6080"
    environment:
      TBOT_WEB_PASSWORD: ${TBOT_WEB_PASSWORD:?set TBOT_WEB_PASSWORD}
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD}
      TBOT_VNC_URL: "http://{host}:${VNC_PORT:-6080}/vnc.html?autoconnect=1&resize=scale"
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - tbot-data:/data
    shm_size: "1gb"

volumes:
  tbot-data:
