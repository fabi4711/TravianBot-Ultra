# Portainer: Stacks → Add stack → Web editor, paste this file.
# Uses the image published by .github/workflows/docker-image.yml. To build from the repository
# instead (Portainer "Repository" stack), replace `image:` with `build: .`.
services:
  tbot-ultra:
    image: ghcr.io/fabi4711/travianbot-ultra:latest
    container_name: tbot-ultra
    restart: unless-stopped
    stop_grace_period: 45s           # lets the bot stop its browser and save state
    ports:
      - "8080:8080"   # web UI
      - "6080:6080"   # live view of the bot's browser (noVNC)
    environment:
      TBOT_WEB_PASSWORD: "change-me"   # basic auth for the web UI (user: admin)
      VNC_PASSWORD: "change-me"        # password for the browser live view
      TZ: "Europe/Berlin"
    volumes:
      - tbot-data:/data
    shm_size: "1gb"                    # Chromium needs more than Docker's 64 MB default

volumes:
  tbot-data:
